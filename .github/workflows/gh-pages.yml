name: Vorschau auf GitHub Pages

# Interner Vorschaukanal: https://hagen381.github.io/website_dlizkfi/
# Live-Hosting ist All-Inkl (deploy-allinkl.yml). Laeuft bei jedem Push auf
# main und erzeugt einen frischen Static Export mit basePath /website_dlizkfi.
#
# Die Vorschau darf NIE in Suchmaschinen landen (doppelter Inhalt): der Build
# setzt bei gesetztem basePath auf jeder Seite noindex und eine robots.txt mit
# "Disallow: /". Der Schritt "Vorschau pruefen" bricht ab, falls das fehlt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: GitHub Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Static Export bauen (Vorschau)
        run: npm run build
        env:
          NEXT_BUILD_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Vorschau pruefen (noindex + robots.txt)
        shell: bash
        run: |
          set -euo pipefail
          fehler=0
          if ! grep -q 'Disallow: /' out/robots.txt; then
            echo "::error::robots.txt der Vorschau sperrt nicht alles."
            fehler=1
          fi
          ohne=$(find out -name '*.html' -print0 | xargs -0 grep -L 'name="robots" content="noindex' || true)
          if [ -n "$ohne" ]; then
            echo "::error::Diese Vorschau-Seiten haben kein noindex:"
            echo "$ohne" | sed 's/^/  /'
            fehler=1
          fi
          [ "$fehler" -eq 0 ] && echo "Vorschau ist fuer Suchmaschinen gesperrt."
          exit $fehler

      # Jede src-/srcset-/url()-Angabe im Export, die mit "/" beginnt, muss mit
      # dem basePath (/website_dlizkfi/) anfangen — sonst 404 in der Vorschau.
      - name: Vorschau pruefen (Pfade mit basePath)
        run: node scripts/vorschau-pfade-pruefen.mjs "${{ steps.pages.outputs.base_path }}"

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

  # Nach dem Veroeffentlichen: Headless-Browser ruft die echte Vorschau auf,
  # scrollt bis unten (lazy-Bilder) und prueft, dass kein Bild, keine Schrift
  # und kein CSS/JS mit Fehler antwortet. Sonst wird der Lauf rot.
  bilder-pruefen:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright installieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/werkzeug"
          cd "$RUNNER_TEMP/werkzeug"
          npm init -y >/dev/null
          npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Bilder in der Vorschau pruefen
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          cp scripts/vorschau-bilder-pruefen.mjs "$RUNNER_TEMP/werkzeug/"
          folge=$(node -p "require('./content/alte-adressen.json').folgen[0].slug")
          # Pages braucht nach dem Deploy manchmal einen Moment
          for i in 1 2 3 4 5 6; do
            curl -sf -o /dev/null "${PAGE_URL}" && break
            sleep 10
          done
          node "$RUNNER_TEMP/werkzeug/vorschau-bilder-pruefen.mjs" "${PAGE_URL%/}" / /episodes/ "/episodes/$folge/" /follow/ \
            | tee "$RUNNER_TEMP/bilder.txt"
          { echo '### Bildpruefung der Vorschau'; echo '```'; cat "$RUNNER_TEMP/bilder.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
