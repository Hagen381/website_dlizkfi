name: Blog auf dem Server aufraeumen

# Entfernt auf All-Inkl Blogartikel-Ordner (blog/<slug>/ und
# images/blog/<slug>/) sowie einzelne Bilddateien in images/blog/<slug>/,
# die es im aktuellen Export nicht mehr gibt.
# Dieselbe Logik laeuft nach jedem Deploy automatisch mit
# (scripts/blog-aufraeumen.sh). Dieser Workflow ist fuer gezielte Laeufe —
# standardmaessig als Testlauf, der nur auflistet.

on:
  workflow_dispatch:
    inputs:
      testlauf:
        description: "Nur auflisten, nichts loeschen"
        type: boolean
        default: true

permissions:
  contents: read

# Nie gleichzeitig mit einem Deploy
concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Static Export bauen (wie live)
        run: npm run build
        env:
          NEXT_BUILD_BASE_PATH: ""

      # lftp ohne apt-Abhaengigkeit (Runner-Stoerung 11.11.2026): erst das
      # Ubuntu-Paket aus dem Actions-Cache, sonst apt, sonst conda-forge.
      # Details: scripts/lftp-installieren.sh
      - name: lftp-Paket aus dem Cache holen
        uses: actions/cache/restore@v4
        with:
          path: ~/lftp-deb
          key: lftp-deb-${{ runner.os }}-${{ runner.arch }}-noble-v1

      - name: lftp installieren
        id: lftp
        shell: bash
        run: ./scripts/lftp-installieren.sh

      - name: lftp-Paket im Cache ablegen
        if: steps.lftp.outputs.cache_neu == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/lftp-deb
          key: lftp-deb-${{ runner.os }}-${{ runner.arch }}-noble-v1

      - name: Veraltete Blogartikel auflisten bzw. entfernen
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TESTLAUF: ${{ inputs.testlauf && '1' || '0' }}
          EXPORT: out
          LIVE_URL: https://www.daslebenistzukurzfuerirgendwann.de
        run: ./scripts/blog-aufraeumen.sh
