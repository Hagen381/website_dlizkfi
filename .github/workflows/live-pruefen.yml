name: Live-Seite pruefen

# Prueft die Live-Seite (seit 03.11.2026 auf All-Inkl) im Headless-Browser,
# nur lesend: Weiterleitungen (http, ohne www -> https://www), Blog, Artikel,
# Navigation, Link auf der Folgenseite, alle Bilder.
# Manuell starten (z. B. nach einem Deploy).

on:
  workflow_dispatch:
    inputs:
      pruefe_404:
        description: "Optional: Pfade, die 404 liefern muessen (kommagetrennt, z. B. entfernte Bilder)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        basis:
          - https://www.daslebenistzukurzfuerirgendwann.de
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright installieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/werkzeug" && cd "$RUNNER_TEMP/werkzeug"
          npm init -y >/dev/null
          npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Pruefen
        shell: bash
        env:
          BASIS: ${{ matrix.basis }}
          PRUEFE_404: ${{ inputs.pruefe_404 }}
        run: |
          set -euo pipefail
          cp scripts/live-pruefen.mjs "$RUNNER_TEMP/werkzeug/"
          node "$RUNNER_TEMP/werkzeug/live-pruefen.mjs" "$BASIS" | tee "$RUNNER_TEMP/ergebnis.txt"
          { echo "### $BASIS"; echo '```'; cat "$RUNNER_TEMP/ergebnis.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
