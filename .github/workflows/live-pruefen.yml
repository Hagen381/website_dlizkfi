name: Live-Seite pruefen

# Prueft die ausgelieferte Seite auf dem All-Inkl-Server im Headless-Browser
# (nur lesend): www und die Generalprobe test. — ist dort schon die neue
# Seite? Blog, Artikel, Navigation, Link auf der Folgenseite, alle Bilder.
# Manuell starten (z. B. nach einem Deploy oder dem Live-Gang).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        basis:
          - https://www.daslebenistzukurzfuerirgendwann.de
          - https://test.daslebenistzukurzfuerirgendwann.de
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright installieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/werkzeug" && cd "$RUNNER_TEMP/werkzeug"
          npm init -y >/dev/null
          npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Pruefen
        shell: bash
        env:
          BASIS: ${{ matrix.basis }}
        run: |
          set -euo pipefail
          cp scripts/live-pruefen.mjs "$RUNNER_TEMP/werkzeug/"
          node "$RUNNER_TEMP/werkzeug/live-pruefen.mjs" "$BASIS" | tee "$RUNNER_TEMP/ergebnis.txt"
          { echo "### $BASIS"; echo '```'; cat "$RUNNER_TEMP/ergebnis.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
