name: Referenz der Live-Seite sichern

# STILLGELEGT seit dem Live-Gang am 03.11.2026.
#
# Hat die alte PodView-Seite als Referenz nach docs/original/ geladen. Unter
# www.daslebenistzukurzfuerirgendwann.de laeuft jetzt die NEUE Seite — ein
# Lauf wuerde die PodView-Referenz mit der eigenen Seite ueberschreiben.
# Deshalb: kein Push-Ausloeser mehr, und der Job bricht sofort ab.
# docs/original/ ist eingefroren (Stand 03.11.2026).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: referenz-holen
  cancel-in-progress: false

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - name: Stillgelegt
        run: |
          echo "::error::Stillgelegt seit dem Live-Gang (03.11.2026): www zeigt auf die neue Seite, die PodView-Referenz in docs/original/ ist eingefroren."
          exit 1

      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/werkzeug"
          cd "$RUNNER_TEMP/werkzeug"
          npm init -y >/dev/null
          npm install --silent playwright@1.49.1 cheerio@1.0.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Referenz holen
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/referenz-holen.mjs "$RUNNER_TEMP/werkzeug/"
          node "$RUNNER_TEMP/werkzeug/referenz-holen.mjs" "$GITHUB_WORKSPACE/docs/original" | tee "$RUNNER_TEMP/log.txt"
          { echo '```'; cat "$RUNNER_TEMP/log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/original
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "Referenz der Live-Seite gesichert (docs/original)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
